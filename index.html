<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipbook</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: #000;
        font-family: Georgia, serif;
        color: #edf2f4;
      }

      .scene {
        --aspect: 0.711; /* page width / height; replaced by the manifest's real shape once it loads */
        --page-h: 872px;
        --page-w: calc(var(--page-h) * var(--aspect));
        perspective: calc(var(--page-h) * 3.5);
      }

      .book {
        position: relative;
        width: calc(var(--page-w) * 2);
        height: var(--page-h);
        transform-style: preserve-3d;
        transition: transform 0.6s ease;
      }

      /* Each leaf sits on the right half and hinges on the spine (its left edge). */
      .leaf {
        position: absolute;
        top: 0;
        left: 50%;
        width: var(--page-w);
        height: var(--page-h);
        transform-origin: left center;
        transform-style: preserve-3d;
        transition: transform 0.8s ease;
        cursor: pointer;
      }
      .leaf.flipped {
        transform: rotateY(-180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: #000;
        overflow: hidden;
      }
      .face.back {
        transform: rotateY(180deg);
      }
      /* The 1% edge trim below would leave a gap at the spine, so each picture is shifted
         toward the spine by the amount trimmed (1% of its own width). */
      .face.front img {
        left: calc(var(--w) * -0.01);
      }
      .face.back img {
        right: calc(var(--w) * -0.01);
      }
      /* Each image is sized (inline, as --w and --h) relative to the largest scan, so every
         page is shown at the same scale and keeps its real proportions. Pages sit flush
         against the spine and are centered vertically. */
      .face img {
        position: absolute;
        display: block;
        width: var(--w);
        height: var(--h);
        top: calc((100% - var(--h)) / 2);
        /* Trim 1% off every edge: the scans have a thin light line along their edges.
           The scans have a dark margin, so no picture content is lost. */
        clip-path: inset(1%);
      }
      /* A thin black strip along the spine edge of every page. Without it, the pale
         page sitting behind another shows through as a light line along the edge. */
      .face::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #000;
      }
      .face.front::after {
        left: 0;
      }
      .face.back::after {
        right: 0;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      button {
        padding: 0.5rem 1.2rem;
        font: inherit;
        color: inherit;
        background: #8d99ae;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="book" id="book"></div>
    </div>

    <div class="controls">
      <button id="first">&laquo; Front cover</button>
      <button id="prev">&larr; Prev</button>
      <span id="status"></span>
      <button id="next">Next &rarr;</button>
      <button id="last">Back cover &raquo;</button>
    </div>

    <script>
      // Pages are loaded straight from this IIIF manifest (Presentation API v2 or v3).
      const MANIFEST_URL = "https://collections.library.yale.edu/manifests/16037197"

      // Smaller versions from the IIIF server: 1000px tall, width scaled to match.
      const PAGE_HEIGHT = 1000

      // One entry per page: the image URL plus the page's size in the manifest.
      function pages(manifest) {
        if (manifest.sequences) {
          // Presentation v2
          return manifest.sequences[0].canvases.map(canvas => ({
            url: canvas.images[0].resource["@id"],
            w: canvas.width,
            h: canvas.height,
          }))
        }
        // Presentation v3
        return manifest.items.map(canvas => {
          let body = canvas.items[0].items[0].body
          if (Array.isArray(body)) body = body[0]
          return { url: body.id, w: canvas.width, h: canvas.height }
        })
      }

      async function init() {
        let images // [{ src, style }]
        try {
          const res = await fetch(MANIFEST_URL)
          if (!res.ok) throw new Error(`HTTP ${res.status}`)
          const list = pages(await res.json())

          // The page box takes the shape of the largest scan; every other page is drawn
          // at the same scale, so smaller scans look smaller (like the real book).
          const sized = list.filter(p => p.w && p.h)
          const maxW = Math.max(...sized.map(p => p.w), 1)
          const maxH = Math.max(...sized.map(p => p.h), 1)
          const aspect = sized.length ? maxW / maxH : 0.711
          document.querySelector(".scene").style.setProperty("--aspect", aspect)

          images = list.map(p => {
            const known = p.w && p.h
            // Request each image at the same scale: the tallest scan gets PAGE_HEIGHT.
            const height = known ? Math.round((PAGE_HEIGHT * p.h) / maxH) : PAGE_HEIGHT
            return {
              src: p.url.replace(/\/full\/(full|max)\//, `/full/,${height}/`),
              style: known ? `--w:${(p.w / maxW) * 100}%;--h:${(p.h / maxH) * 100}%` : "--w:100%;--h:100%;object-fit:contain",
            }
          })
        } catch (err) {
          document.getElementById("status").textContent = `Could not load manifest: ${err.message}`
          return
        }

        const book = document.getElementById("book")
        for (let i = 0; i < images.length; i += 2) {
          const leaf = document.createElement("div")
          leaf.className = "leaf"
          const img = (p, n) => `<img data-src="${p.src}" style="${p.style}" alt="Page ${n}">`
          const back = images[i + 1] ? img(images[i + 1], i + 2) : ""
          leaf.innerHTML = `<div class="face front">${img(images[i], i + 1)}</div>` + `<div class="face back">${back}</div>`
          book.appendChild(leaf)
        }
        const leaves = [...book.querySelectorAll(".leaf")]
        const prev = document.getElementById("prev")
        const next = document.getElementById("next")
        const first = document.getElementById("first")
        const last = document.getElementById("last")
        const status = document.getElementById("status")
        const total = leaves.length
        let current = 0 // number of leaves flipped to the left

        // Only load images for leaves near the current page, so we don't request
        // hundreds of images at once.
        function loadNear() {
          leaves.forEach((leaf, i) => {
            if (Math.abs(i - current) > 2) return
            leaf.querySelectorAll("img[data-src]").forEach(img => {
              const url = img.dataset.src
              img.removeAttribute("data-src")
              let tries = 0
              // If the server rejects a request, try again after a short wait.
              img.addEventListener("error", () => {
                if (tries++ < 5) setTimeout(() => (img.src = url), 1000 * tries)
              })
              img.src = url
            })
          })
        }

        function render() {
          loadNear()
          leaves.forEach((leaf, i) => {
            leaf.classList.toggle("flipped", i < current)
            // Flipped leaves stack with the latest on top; unflipped with the next on top.
            leaf.style.zIndex = i < current ? i : total - i
          })
          // Keep the book centered when closed (front cover / back cover).
          book.style.transform = current === 0 ? "translateX(-25%)" : current === total ? "translateX(25%)" : "translateX(0)"
          prev.disabled = current === 0
          first.disabled = current === 0
          next.disabled = current === total
          last.disabled = current === total
          status.textContent = `${current} / ${total}`
        }

        const goNext = () => {
          if (current < total) {
            current++
            render()
          }
        }
        const goPrev = () => {
          if (current > 0) {
            current--
            render()
          }
        }

        first.addEventListener("click", () => {
          current = 0
          render()
        })
        last.addEventListener("click", () => {
          current = total
          render()
        })
        next.addEventListener("click", goNext)
        prev.addEventListener("click", goPrev)
        leaves.forEach((leaf, i) => leaf.addEventListener("click", () => (i < current ? goPrev() : goNext())))
        document.addEventListener("keydown", e => {
          if (e.key === "ArrowRight") goNext()
          if (e.key === "ArrowLeft") goPrev()
        })

        render()
      }

      init()
    </script>
  </body>
</html>
